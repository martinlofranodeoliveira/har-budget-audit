name: Dart checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    container:
      image: dart:stable
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Prepare locked development dependencies
        run: |
          dart --disable-analytics
          dart pub get --enforce-lockfile
        timeout-minutes: 3
      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed lib bin test
        timeout-minutes: 1
      - name: Analyze
        run: dart analyze --fatal-infos
        timeout-minutes: 2
      - name: Test
        run: dart test
        timeout-minutes: 3
      - name: Offline synthetic demo
        run: dart run bin/har_budget_audit.dart demo --format json
        timeout-minutes: 1
